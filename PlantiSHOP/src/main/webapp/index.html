<!DOCTYPE html>
<html lang="es-MX">
    <head>
        <title>PlantiSHOP</title>
        <link rel="icon" type="image/x-icon" href="imgs/logo.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
        <style>
            @font-face {
                font-family: 'Coco Gothic';
                src: url(fonts/CocoGothic.ttf);
            }
            @font-face {
                font-family: 'Agrandir';
                src: url(fonts/Agrandir.otf);
            }
            body {
                background-image: url(imgs/fondo.png);
                background-size: cover;
                background-attachment: fixed;
                background-position: center;
                background-repeat: no-repeat;
                min-height: 100vh;
                font-family: 'Coco Gothic', sans-serif;
            }
            h1, h2 {
                color: whitesmoke;
                text-align: center;
                font-family: 'Agrandir', sans-serif;
            }
            h1 {
                font-size: 8vw;
            }
            h2 {
                font-size: 4vw;
            }
            .custom-btn {
                background-color: #198754;
                color: white;
                border: none;
                border-radius: 10px;
                padding: 1em 2em;
                font-weight: bold;
                transition: 0.3s;
            }
            .custom-btn:hover {
                background-color: #299764;
                color: white;
            }
            .custom-link {
                display: block;
                width: fit-content;
                max-width: 90%;
                margin: 3rem auto 0;
                padding: 1rem 2rem;
                font-size: 2vw;
                font-weight: bold;
                text-align: center;
                background-color: #f5f5dc;
                color: #212529;
                border-radius: 20px;
                text-decoration: none;
                transition: 0.3s;
            }
            .custom-link:hover {
                background-color: #e1e1c8;
                color: black;
            }
            .top-right {
                position: absolute;
                top: 1.5rem;
                right: 2rem;
                text-align: end;
            }
            .top-right p {
                margin-bottom: 0.5rem;
                font-weight: bold;
                color: #f0f0f0;
            }
            @media (max-width: 768px) {
                h1 {
                    font-size: 12vw;
                }
                h2 {
                    font-size: 6vw;
                }
                .custom-link {
                    font-size: 4vw;
                }
            }
        </style>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                window.location.hash = "no-back-button";
                window.location.hash = "Again-No-back-button";
                window.onhashchange = function () {
                    window.location.hash = "";
                };
            });
        </script>
    </head>
    <body>
        <div class="top-right">
            <p style="color: white;">¿No tienes una Cuenta Personal?</p>
            <button class="custom-btn" onclick="location.assign('Registro.jsp')">Regístrate AQUÍ</button>
        </div>
        <div class="d-flex flex-column justify-content-center align-items-center text-center" style="height: 100vh;">
            <h1>PlantiSHOP</h1>
            <h2>¡Naturaleza a tu Alcance!</h2>
            <a href="Sesion.html" class="custom-link">INICIO DE SESIÓN</a>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
