<!DOCTYPE html>
<html lang="es-MX">
    <head>
        <title>Inicio de Sesion</title>
        <link rel="icon" type="image/x-icon" href="imgs/logo.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
        <style>
            @font-face {
                font-family: 'Coco Gothic';
                src: url(fonts/CocoGothic.ttf);
            }
            @font-face {
                font-family: 'Agrandir';
                src: url(fonts/Agrandir.otf);
            }
            body {
                background-image: url(imgs/fondo.png);
                background-repeat: no-repeat;
                background-size: cover;
                background-attachment: fixed;
                background-position: center center;
                min-height: 100vh;
                font-family: 'Coco Gothic', sans-serif;
            }
            h1, h2 {
                text-align: center;
                font-family: 'Agrandir', sans-serif;
                color: whitesmoke;
            }
            h1 {
                font-size: 5vw;
            }
            h2 {
                font-size: 2.5vw;
                margin-bottom: 1.5rem;
            }
            .form-container {
                background-color: rgba(255, 255, 255, 0.9);
                border-radius: 20px;
                padding: 2rem;
                color: black;
                max-width: 500px;
                margin: 4rem auto;
                box-shadow: 0 0 15px rgba(0,0,0,0.2);
            }
            label {
                font-weight: bold;
                margin-top: 1rem;
            }
            input.form-control {
                border-radius: 10px;
            }
            .custom-btn {
                background-color: #198754;
                color: white;
                font-weight: bold;
                border: none;
                border-radius: 10px;
                padding: 0.75rem 1.5rem;
                transition: background-color 0.3s;
            }
            .custom-btn:hover {
                background-color: #299764;
            }
            .divider {
                display: flex;
                align-items: center;
                text-align: center;
                margin-top: 2em;
                margin-bottom: 1em;
                color: #666;
                font-weight: bold;
            }
            .divider::before,
            .divider::after {
                content: "";
                flex: 1;
                border-bottom: 1px solid #bbb;
            }
            .divider::before {
                margin-right: .75em;
            }
            .divider::after {
                margin-left: .75em;
            }
            .text-link {
                display: block;
                text-align: center;
                font-weight: bold;
                color: #198754;
                text-decoration: none;
                font-size: 1rem;
                transition: color 0.3s ease;
            }
            .text-link:hover {
                text-decoration: underline;
                color: #145c38;
            }
            .logo {
                width: 1.5em;
                height: 1.5em;
                vertical-align: middle;
            }
            @media (max-width: 768px) {
                h1 {
                    font-size: 8vw;
                }
                h2 {
                    font-size: 5vw;
                }
            }
        </style>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                window.location.hash = "no-back-button";
                window.location.hash = "Again-No-back-button";
                window.onhashchange = function () {
                    window.location.hash = "";
                };
            });
        </script>
    </head>
    <body>
        <h1 class="mt-4"><img src="imgs/logo.png" alt="Logo" class="logo">&nbsp;PlantiSHOP</h1>
        <div class="form-container">
            <form action="Interfaz.jsp" method="post">
                <input name="x" type="hidden" value="R">
                <h2 style="color: black;">Inicio de Sesión</h2>
                <div class="mb-3">
                    <label for="i1" class="form-label">Correo Electrónico:</label>
                    <input id="i1" name="ce" type="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="i2" class="form-label">Contraseña:</label>
                    <input id="i2" name="c1" type="password" class="form-control" minlength="12" maxlength="20" required>
                </div>
                <div class="mb-3">
                    <label for="i3" class="form-label">Contraseña de Respaldo:</label>
                    <input id="i3" name="c2" type="password" class="form-control" minlength="12" maxlength="20" required>
                </div>
                <div class="divider">¿No tienes una Cuenta?&nbsp;<a href="Registro.jsp" class="text-link">Regístrate AQUÍ</a></div>
                <div class="text-center">
                    <input type="submit" value="INGRESAR" class="custom-btn">
                </div>
            </form>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
